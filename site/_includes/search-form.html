<form class="{{ include.classes }}" role="search" action="{{ '/search/' | relative_url }}" method="get">
  <div class="input-group" style="max-width: 50rem">
    <input class="form-control" type="search" name="q"
           placeholder="" aria-label="Search appeals"
           autocomplete="off">
    <button class="btn btn-black" type="submit">Search</button>
  </div>
</form>
