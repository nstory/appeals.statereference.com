title: StateReference Appeals Database
description: "Full-text database of determinations issued by the Massachusetts Supervisor of Records on public records appeals"
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://appeals.statereference.com" # the base hostname & protocol for your site, e.g. http://example.com
tagline: Massachusetts Public Records Appeals

defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/share.png

# Build settings
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

sass:
  style: compressed
  load_paths:
    - node_modules
  quiet_deps: true
  silence_deprecations: [import, global-builtin, color-functions]

exclude:
  - Makefile
  - lib
  - package.json
  - package-lock.json

# Pagefind writes its bundle into _site, which Jekyll didn't generate and so
# deletes on every regeneration -- including the ones `jekyll serve --watch`
# does under a running server, which leaves search broken until the next
# `make index`.  Keeping it means the index survives edits; it only goes stale
# when etl/output/cases.jsonl changes, and `make reindex` refreshes it.  The two
# defaults have to be repeated; this replaces them.
keep_files: [".git", ".svn", "pagefind"]
